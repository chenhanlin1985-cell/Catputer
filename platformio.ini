[platformio]
; Touch endpoint is the active product line. Cardputer remains buildable, but is in maintenance/archive mode.
default_envs = waveshare-amoled-18

[env:m5stack-cardputer]
platform = espressif32@6.13.0
board = m5stack-stamps3
framework = arduino
board_build.partitions = partitions_catputer_local_tts.csv
lib_deps =
    m5stack/M5Cardputer@^1.0.2
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCATPUTER_ENABLE_LOCAL_ESP_TTS=1
    -Itools/local_tts/esp_sr/esp_tts_esp_tts_chinese/include
    -Itools/local_tts/esp_sr/include/esp32s3
    -Ltools/local_tts/esp_sr/esp_tts_esp_tts_chinese/esp32s3
    -Ltools/local_tts/esp_sr/lib/esp32s3
    -Wl,--start-group
    -lesp_tts_chinese
    -lvoice_set_xiaole
    -lc_speech_features
    -ldl_lib
    -lesp_audio_front_end
    -lesp_audio_processor
    -lflite_g2p
    -lfst
    -lhufzip
    -lmultinet
    -lnsnet
    -lvadnet
    -lwakenet
    -Wl,--end-group
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -DAPI_HOST=\"${sysenv.API_HOST}\"
    -DAPI_PORT=\"${sysenv.API_PORT}\"
    -DAPI_KEY=\"${sysenv.API_KEY}\"
    -DSTT_PROXY_HOST=\"${sysenv.STT_PROXY_HOST}\"
    -DSTT_PROXY_PORT=\"${sysenv.STT_PROXY_PORT}\"
    -DWIFI_SSID2=\"${sysenv.WIFI_SSID2}\"
    -DWIFI_PASS2=\"${sysenv.WIFI_PASS2}\"
    -DAPI_HOST2=\"${sysenv.API_HOST2}\"
    -DDEFAULT_CITY=\"${sysenv.DEFAULT_CITY}\"
build_src_filter =
    +<*>
    -<main_waveshare_lvgl.cpp>
    -<waveshare_*.cpp>
    -<waveshare_es8311_bridge.c>
    -<lv_font_cat_cn_16.c>
monitor_speed = 115200
upload_port = /dev/cu.usbmodem3101
monitor_port = /dev/cu.usbmodem3101

[env:waveshare-amoled-18]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.partitions = partitions_waveshare_ota.csv
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    lvgl/lvgl@8.4.0
lib_ignore =
    U8g2
lib_extra_dirs =
    lib/waveshare
build_src_filter =
    +<*>
    -<main.cpp>
    -<chat.cpp>
    -<bluetooth_keyboard_mode.cpp>
    -<waveshare_diag.cpp>
    -<waveshare_baseline.cpp>
    -<waveshare_lvgl_probe.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCATPUTER_WAVESHARE_AMOLED_18=1
    -DCATPUTER_UI_TOUCH=1
    -DCATPUTER_TOUCH_UI=1
    -DCATPUTER_SCREEN_W=368
    -DCATPUTER_SCREEN_H=448
    -DCATPUTER_DEVICE_TYPE=\"waveshare_amoled_18\"
    -DCATPUTER_CAP_TOUCH=1
    -DCATPUTER_CAP_KEYBOARD=0
    -DCATPUTER_CAP_MIC=1
    -DCATPUTER_CAP_SPEAKER=1
    -DCATPUTER_ENABLE_LOCAL_ESP_TTS=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -Iinclude
    -fno-char8_t
    -Itools/local_tts/esp_sr/esp_tts_esp_tts_chinese/include
    -Itools/local_tts/esp_sr/include/esp32s3
    -Ltools/local_tts/esp_sr/esp_tts_esp_tts_chinese/esp32s3
    -Ltools/local_tts/esp_sr/lib/esp32s3
    -Wl,--start-group
    -lesp_tts_chinese
    -lvoice_set_xiaole
    -lc_speech_features
    -ldl_lib
    -lesp_audio_front_end
    -lesp_audio_processor
    -lflite_g2p
    -lfst
    -lhufzip
    -lmultinet
    -lnsnet
    -lvadnet
    -lwakenet
    -Wl,--end-group
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -DAPI_HOST=\"${sysenv.API_HOST}\"
    -DAPI_PORT=\"${sysenv.API_PORT}\"
    -DAPI_KEY=\"${sysenv.API_KEY}\"
    -DSTT_PROXY_HOST=\"${sysenv.STT_PROXY_HOST}\"
    -DSTT_PROXY_PORT=\"${sysenv.STT_PROXY_PORT}\"
    -DWIFI_SSID2=\"${sysenv.WIFI_SSID2}\"
    -DWIFI_PASS2=\"${sysenv.WIFI_PASS2}\"
    -DAPI_HOST2=\"${sysenv.API_HOST2}\"
    -DDEFAULT_CITY=\"${sysenv.DEFAULT_CITY}\"
monitor_speed = 115200
upload_port = COM6
monitor_port = COM6

[env:waveshare-amoled-18-diag]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
lib_extra_dirs = lib/waveshare
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCATPUTER_WAVESHARE_AMOLED_18=1
    -DCATPUTER_SCREEN_W=368
    -DCATPUTER_SCREEN_H=448
    -DCATPUTER_WAVESHARE_DIAG=1
build_src_filter =
    -<*>
    +<waveshare_diag.cpp>
monitor_speed = 115200
upload_port = COM6
monitor_port = COM6

[env:waveshare-amoled-18-baseline]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
lib_extra_dirs = lib/waveshare
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCATPUTER_WAVESHARE_BASELINE=1
build_src_filter =
    -<*>
    +<waveshare_baseline.cpp>
monitor_speed = 115200
upload_port = COM6
monitor_port = COM6

[env:waveshare-amoled-18-lvgl-probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    lvgl/lvgl@8.4.0
lib_extra_dirs =
    lib/waveshare
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCATPUTER_WAVESHARE_LVGL_PROBE=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -Iinclude
build_src_filter =
    -<*>
    +<waveshare_lvgl_probe.cpp>
monitor_speed = 115200
upload_port = COM6
monitor_port = COM6

[env:native]
platform = native
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
test_filter = test_native
